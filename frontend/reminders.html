<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarePulse - Reminders</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="auth-guard.js"></script>
    <script src="api.js"></script>
    <div class="dashboard-wrapper">
        <nav class="top-navbar">
            <div class="navbar-left">
                <img src="images/logo.png" alt="CarePulse Logo" class="navbar-logo">
                <span class="navbar-title">CarePulse AI</span>
            </div>
            <div class="navbar-center">
                <span class="hospital-name" id="hospitalName"></span>
            </div>
            <div class="navbar-right">
                <button class="logout-btn" id="logoutBtn" title="Logout">
                    <span>🚪</span>
                </button>
            </div>
        </nav>

        <div class="dashboard-layout">
            <aside class="sidebar">
                <nav class="sidebar-nav">
                    <a href="dashboard.html" class="nav-link">
                        <span class="nav-icon">📊</span>
                        <span class="nav-label">Dashboard</span>
                    </a>
                    <a href="patients.html" class="nav-link">
                        <span class="nav-icon">👥</span>
                        <span class="nav-label">Patients</span>
                    </a>
                    <a href="add-patient.html" class="nav-link">
                        <span class="nav-icon">➕</span>
                        <span class="nav-label">Add Patient</span>
                    </a>
                    <a href="medication.html" class="nav-link">
                        <span class="nav-icon">💊</span>
                        <span class="nav-label">Medications</span>
                    </a>
                    <a href="reminders.html" class="nav-link active">
                        <span class="nav-icon">🔔</span>
                        <span class="nav-label">Reminders</span>
                    </a>
                    <a href="messages.html" class="nav-link">
                        <span class="nav-icon">💬</span>
                        <span class="nav-label">Messages</span>
                    </a>
                    <a href="reports.html" class="nav-link">
                        <span class="nav-icon">📈</span>
                        <span class="nav-label">Reports</span>
                    </a>
                    <a href="settings.html" class="nav-link">
                        <span class="nav-icon">⚙️</span>
                        <span class="nav-label">Settings</span>
                    </a>
                </nav>
            </aside>

            <main class="main-content">
                <section class="page-header">
                    <div class="header-left">
                        <h1>Reminders</h1>
                        <span class="patient-count-badge" id="reminderCountBadge">—</span>
                    </div>
                </section>

                <!-- Filter Bar -->
                <section class="filter-bar">
                    <div class="filter-group">
                        <label for="filterType">Type:</label>
                        <select id="filterType" class="filter-select">
                            <option value="">All Types</option>
                            <option value="MEDICATION">Medication</option>
                            <option value="APPOINTMENT">Appointment</option>
                            <option value="LIFESTYLE">Lifestyle</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filterStatus">Status:</label>
                        <select id="filterStatus" class="filter-select">
                            <option value="">All Statuses</option>
                            <option value="PENDING">Pending</option>
                            <option value="SENT">Sent</option>
                            <option value="FAILED">Failed</option>
                            <option value="CANCELLED">Cancelled</option>
                        </select>
                    </div>
                    <button class="reset-btn" id="btnReset">🔄 Reset</button>
                </section>

                <!-- Reminders Table -->
                <section class="table-section">
                    <div class="table-wrapper">
                        <table class="patient-table">
                            <thead>
                                <tr>
                                    <th>Patient</th>
                                    <th>Type</th>
                                    <th>Message</th>
                                    <th>Scheduled</th>
                                    <th>Sent</th>
                                    <th>Status</th>
                                    <th>Confirmed</th>
                                </tr>
                            </thead>
                            <tbody id="reminderTableBody">
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- Pagination -->
                <section class="pagination-section">
                    <div class="pagination-info" id="paginationInfo">—</div>
                    <div class="pagination-controls">
                        <button class="pagination-btn" id="btnPrev" disabled>← Previous</button>
                        <span class="pagination-page" id="pageIndicator">Page 1</span>
                        <button class="pagination-btn" id="btnNext">Next →</button>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="mockData.js"></script>
    <script src="reminders.js"></script>
</body>
</html>
