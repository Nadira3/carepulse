<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarePulse - Settings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="auth-guard.js"></script>
    <script src="api.js"></script>
    <div class="dashboard-wrapper">
        <nav class="top-navbar">
            <div class="navbar-left">
                <img src="images/logo.png" alt="CarePulse Logo" class="navbar-logo">
                <span class="navbar-title">CarePulse AI</span>
            </div>
            <div class="navbar-center">
                <span class="hospital-name" id="hospitalName"></span>
            </div>
            <div class="navbar-right">
                <button class="logout-btn" id="logoutBtn" title="Logout"><span>🚪</span></button>
            </div>
        </nav>
        <div class="dashboard-layout">
            <aside class="sidebar">
                <nav class="sidebar-nav">
                    <a href="dashboard.html" class="nav-link"><span class="nav-icon">📊</span><span class="nav-label">Dashboard</span></a>
                    <a href="patients.html" class="nav-link"><span class="nav-icon">👥</span><span class="nav-label">Patients</span></a>
                    <a href="add-patient.html" class="nav-link"><span class="nav-icon">➕</span><span class="nav-label">Add Patient</span></a>
                    <a href="medication.html" class="nav-link"><span class="nav-icon">💊</span><span class="nav-label">Medications</span></a>
                    <a href="reminders.html" class="nav-link"><span class="nav-icon">🔔</span><span class="nav-label">Reminders</span></a>
                    <a href="messages.html" class="nav-link"><span class="nav-icon">💬</span><span class="nav-label">Messages</span></a>
                    <a href="reports.html" class="nav-link"><span class="nav-icon">📈</span><span class="nav-label">Reports</span></a>
                    <a href="settings.html" class="nav-link active"><span class="nav-icon">⚙️</span><span class="nav-label">Settings</span></a>
                </nav>
            </aside>
            <main class="main-content">
                <!-- My Profile -->
                <section class="page-header">
                    <h1>Settings</h1>
                </section>

                <section class="form-section">
                    <h2 class="section-title">👤 My Profile</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" id="myName" class="form-input" readonly>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="text" id="myEmail" class="form-input" readonly>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Role</label>
                            <input type="text" id="myRole" class="form-input" readonly>
                        </div>
                    </div>
                </section>

                <!-- Clinician Management — Admin only -->
                <section class="form-section" id="adminSection" style="display:none">
                    <div class="page-header" style="margin-bottom:1rem">
                        <h2 class="section-title" style="margin:0">👩‍⚕️ Clinician Accounts</h2>
                        <button class="action-btn" id="btnAddClinician">➕ Add Clinician</button>
                    </div>

                    <!-- Add Clinician Form -->
                    <div id="addClinicianForm" style="display:none" class="registration-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="newFirstName">First Name <span class="required">*</span></label>
                                <input type="text" id="newFirstName" class="form-input" placeholder="First name">
                            </div>
                            <div class="form-group">
                                <label for="newLastName">Last Name <span class="required">*</span></label>
                                <input type="text" id="newLastName" class="form-input" placeholder="Last name">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="newEmail">Email <span class="required">*</span></label>
                                <input type="email" id="newEmail" class="form-input" placeholder="clinician@hospital.com">
                            </div>
                            <div class="form-group">
                                <label for="newPassword">Password <span class="required">*</span></label>
                                <input type="password" id="newPassword" class="form-input" placeholder="Min 8 characters">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="newRole">Role</label>
                                <select id="newRole" class="form-input">
                                    <option value="CLINICIAN">Clinician</option>
                                    <option value="ADMIN">Admin</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-buttons" style="margin-top:1rem">
                            <button type="button" class="btn-secondary" id="btnCancelAdd">Cancel</button>
                            <button type="button" class="btn-primary" id="btnCreateClinician">✓ Create Account</button>
                        </div>
                    </div>

                    <!-- Users table -->
                    <div class="table-wrapper" style="margin-top:1rem">
                        <table class="patient-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Last Login</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="usersTableBody">
                                <tr><td colspan="6" class="table-empty-message">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>
    <div class="toast" id="toast"><span id="toastMessage"></span></div>
    <script src="mockData.js"></script>
    <script src="settings.js"></script>
</body>
</html>
